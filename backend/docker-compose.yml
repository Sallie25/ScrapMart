services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: scrapmart-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: scrapmart-redis

    command: ["redis-server", "--save", "", "--appendonly", "no"]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
