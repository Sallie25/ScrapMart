[project]
name = "scrapmart-backend"
version = "0.1.0"
description = "Backend API for the ScrapMart marketplace."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3,<3",
    "fastapi>=0.142.2",
    "pillow>=12,<13",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1,<3",
    "redis>=6,<8",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
